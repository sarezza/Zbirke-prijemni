<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HemijaLab — Prijemni</title><style>:root{font-family:system-ui,Arial;background:#0d1724;color:#eaf4f3}*{box-sizing:border-box}body{margin:0}header{padding:24px max(24px,calc((100vw - 1100px)/2));background:#142538;border-bottom:1px solid #294153}h1{margin:0;color:#70e0b2}p{color:#a8bfca}.wrap{max-width:1100px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card,.quiz{background:#182a3b;border:1px solid #30485a;border-radius:16px;padding:20px}.card{cursor:pointer;text-align:left;color:#fff;font:inherit}.card:hover{border-color:#70e0b2}.num{color:#70e0b2;font-size:13px}.quiz{max-width:750px;margin:auto}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:1px solid #42596b;border-radius:10px;background:#20364a;color:#fff;font:inherit;cursor:pointer}.option.selected{border-color:#70e0b2;background:#244d4a}.option.correct{border-color:#5de5a3;background:#174b3a}.option.wrong{border-color:#ff8787;background:#60363b}.btn{background:#70e0b2;color:#102a2a;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#30475a;color:white}.feedback{margin-top:18px;padding:16px;border-radius:10px;background:#243b4b}.hidden{display:none}small{color:#a8bfca}footer{margin:40px auto;text-align:center;color:#92a8b5}</style></head><body><header><h1>⚗ HemijaLab</h1><p>Uči • Vežbaj • Razumi — priprema prijemnog iz hemije</p></header><main class="wrap"><section id="home"><h2>Izaberi oblast</h2><p>15 oblasti • 75 pitanja sa trenutnom proverom i objašnjenjem. Pitanja se prikazuju nasumičnim redosledom pri svakom pokretanju oblasti.</p><div id="topics" class="grid"></div></section><section id="test" class="quiz hidden"><small id="progress"></small><h2 id="topic"></h2><h3 id="question"></h3><div id="answers"></div><button class="btn" id="check" disabled>Proveri odgovor</button><button class="btn hidden" id="next">Sledeće pitanje</button><button class="btn secondary" id="back">Sve oblasti</button><div id="feedback" class="feedback hidden" aria-live="polite"></div></section></main><footer>HemijaLab • Vežbanje hemije za prijemni</footer><script>window.EXTRA_QUESTIONS=[[["Koliko protona ima atom sa atomskim brojem 17?",["17","18","35","7"],0,"Atomski broj Z jednak je broju protona."],["Maksimalan broj elektrona na drugom energetskom nivou je:",["2","6","8","18"],2,"Za n=2 važi 2n²=8."],["Izotopi istog elementa razlikuju se po broju:",["Protona","Neutrona","Elektronskih ljuski","Orbitala"],1,"Isti Z, različit broj neutrona."],["Koja konfiguracija odgovara neonu?",["1s²2s²2p⁶","1s²2s²2p⁴","1s²2s²2p⁵","1s²2s²2p⁶3s¹"],0,"Neon ima 10 elektrona."]],[["Koji molekul je nepolaran?",["HCl","H₂O","CO₂","NH₃"],2,"CO₂ je linearan, pa se dipolni momenti poništavaju."],["Veza u NaCl je pretežno:",["Jonska","Metalna","Nepolarna kovalentna","Vodonična"],0,"Na predaje elektron, Cl ga prima."],["Koja čestica ima trigonalno-piramidalni oblik?",["CO₂","BF₃","NH₃","CH₄"],2,"NH₃ ima tri veze i jedan slobodan elektronski par."],["Vodonična veza najtipičnije nastaje kada je H vezan za:",["C, Si ili P","F, O ili N","Na ili K","Cl ili Br isključivo"],1,"N, O i F su mali i vrlo elektronegativni."]],[["Koja veličina meri neuređenost sistema?",["Entropija","Entalpija","Gustina","Molarna masa"],0,"Entropija je povezana sa brojem dostupnih mikrostanja."],["Ako se temperatura poveća, brzina većine reakcija:",["Opada","Raste","Ne menja se","Postaje nula"],1,"Veći udeo čestica dostiže energiju aktivacije."],["Koja promena je endotermna?",["Sagorevanje metana","Smrzavanje vode","Topljenje leda","Neutralizacija jake kiseline i baze"],2,"Za topljenje je potrebno dovesti toplotu."],["Katalizator u reakciji:",["Povećava ΔH","Smanjuje Ea","Povećava masu proizvoda","Pomera ravnotežu"],1,"Snižava aktivacionu barijeru, bez promene ravnoteže."]],[["Povećanje pritiska pomera gasnu ravnotežu ka strani sa:",["Više molova gasa","Manje molova gasa","Više čvrstih supstanci","Većom masom"],1,"Sistem favorizuje stranu sa manje gasnih čestica."],["Za ravnotežu N₂ + 3H₂ ⇌ 2NH₃, povećanje [H₂] favorizuje:",["Reaktante","Proizvode","Nema efekta","Razlaganje NH₃"],1,"Dodatak reaktanta pomera ravnotežu ka proizvodima."],["Od čega zavisi konstanta ravnoteže K?",["Od početne mase","Od katalizatora","Od temperature","Od zapremine uvek"],2,"Za datu reakciju K zavisi od temperature."],["U ravnoteži su brzine direktne i povratne reakcije:",["Jednake","Obe nula","Različite","Uvek rastu"],0,"Hemijska ravnoteža je dinamička."]],[["Koliko molova je u 200 mL rastvora koncentracije 0,5 mol/L?",["0,1","0,25","1","2,5"],0,"n=cV=0,5·0,2=0,1 mol."],["Koja formula važi pri razblaživanju?",["c₁V₁=c₂V₂","c₁+c₂=V₁+V₂","cV=m","n=V/M"],0,"Količina rastvorene supstance ostaje ista."],["Kolika je molarna masa H₂O (H=1, O=16)?",["16","17","18","20"],2,"2·1+16=18 g/mol."],["Maseni udeo rastvorene supstance jednak je:",["m(rastvorene)/m(rastvora)","m(rastvora)/m(rastvorene)","n/V","V/n"],0,"To je odnos mase rastvorene supstance i mase rastvora."]],[["Koja je jaka kiselina u vodi?",["CH₃COOH","HCl","H₂CO₃","HCN"],1,"HCl gotovo potpuno disosuje u razblaženom vodenom rastvoru."],["Koja je jaka baza?",["NH₃","NaOH","Al(OH)₃","Fe(OH)₃"],1,"NaOH je jaka baza."],["Po Brønstedu kiselina je:",["Donor protona","Akceptor protona","Donor elektrona","Akceptor neutrona"],0,"Brønstedova kiselina predaje H⁺."],["Konjugovana baza kiseline H₂CO₃ je:",["CO₃²⁻","HCO₃⁻","H₃O⁺","OH⁻"],1,"Gubitkom jednog H⁺ nastaje HCO₃⁻."]],[["pH neutralne vode na 25 °C je:",["0","7","10","14"],1,"Na 25 °C neutralan rastvor ima pH 7."],["Ako je pH=2, [H⁺] je:",["10²","10⁻²","2","10⁻¹²"],1,"[H⁺]=10⁻ᵖᴴ mol/L."],["Koji par može da čini pufer?",["HCl/NaCl","CH₃COOH/CH₃COONa","NaOH/NaCl","HNO₃/KNO₃"],1,"Slaba kiselina i njena konjugovana baza čine pufer."],["Rastvor Na₂CO₃ u vodi je najčešće:",["Kiseo","Bazan","Neutralan uvek","Bez jona"],1,"Karbonatni jon hidrolizuje i stvara OH⁻."]],[["Oksidacioni broj kiseonika u H₂O je:",["+2","−2","0","−1"],1,"U vodi kiseonik ima oksidacioni broj −2."],["Redukciono sredstvo se tokom reakcije:",["Redukuje","Oksiduje","Ne menja","Taloži"],1,"Redukciono sredstvo predaje elektrone i oksiduje se."],["U galvanskom elementu elektroni teku spoljnim kolom od:",["Katode ka anodi","Anode ka katodi","Elektrolita ka soli","Obe elektrode ka rastvoru"],1,"Na anodi nastaju elektroni oksidacijom."],["Oksidacioni broj elementarnog Fe je:",["+2","+3","0","−2"],2,"Element u slobodnom stanju ima oksidacioni broj nula."]],[["Koji oksid je bazni?",["SO₃","CO₂","Na₂O","P₄O₁₀"],2,"Na₂O je bazni oksid alkalnog metala."],["Koji gas nastaje pri reakciji kiseline sa karbonatom?",["H₂","O₂","CO₂","N₂"],2,"Karbonat sa kiselinom daje so, vodu i CO₂."],["Koji element je halogen?",["Mg","Cl","Na","Ca"],1,"Hlor pripada 17. grupi periodnog sistema."],["Koji jon daje plavu boju mnogim vodenim rastvorima?",["Na⁺","Cu²⁺","K⁺","Ca²⁺"],1,"Hidratizovani joni Cu²⁺ često daju plavu boju."]],[["Opšta formula acikličnih alkena sa jednom dvostrukom vezom je:",["CₙH₂ₙ₊₂","CₙH₂ₙ","CₙH₂ₙ₋₂","CₙHₙ"],1,"Jedna C=C veza smanjuje broj H za dva u odnosu na alkan."],["Koliko strukturnih izomera ima butan?",["1","2","3","4"],1,"Postoje n-butan i 2-metilpropan."],["Reakcija karakteristična za alkene je:",["Adicija","Neutralizacija","Saponifikacija","Kondenzacija uvek"],0,"Dvostruka veza omogućava adiciju."],["Za geometrijsku cis/trans izomeriju potrebna je:",["Slobodna rotacija oko C–C","Ograničena rotacija oko C=C i odgovarajući supstituenti","Samo jednostruka veza","Samo jedan ugljenik"],1,"C=C ograničava rotaciju, a oba C moraju imati različite supstituente."]],[["Tipična reakcija benzena je:",["Elektrofilna aromatična supstitucija","Radikalska adicija uvek","Neutralizacija","Hidroliza"],0,"Benzen teži očuvanju aromatičnog sistema."],["Molekulska formula benzena je:",["C₆H₁₂","C₆H₆","C₆H₁₄","C₆H₁₀"],1,"Benzen je aromatični ugljovodonik formule C₆H₆."],["U hlorometanu funkcionalna veza je:",["C–Cl","C=O","O–H","N–H"],0,"Hlorometan je halogeno jedinjenje."],["Koji reagens može nitrirati benzen?",["HNO₃/H₂SO₄","NaCl/H₂O","NaOH/H₂O","H₂/Ni"],0,"Smeša koncentrovanih kiselina generiše elektrofil NO₂⁺."]],[["Koja je funkcionalna grupa alkohola?",["–OH","–CHO","–COOH","–CO–"],0,"Alkoholi imaju hidroksilnu grupu vezanu za zasićen C atom."],["Oksidacijom primarnog alkohola najpre može nastati:",["Keton","Aldehid","Eter","Alken"],1,"Primarni alkohol oksiduje se u aldehid, pa dalje u kiselinu."],["Koji reagens razlikuje aldehid od većine ketona?",["Tollensov reagens","NaCl","Destilovana voda","Etanol"],0,"Aldehidi obično daju pozitivnu Tollensovu probu."],["Propanon pripada:",["Aldehidima","Ketonima","Alkoholima","Etrima"],1,"Propanon (aceton) ima karbonilnu grupu između dva C atoma."]],[["Karboksilna grupa je:",["–COOH","–OH","–NH₂","–CHO"],0,"Karboksilne kiseline sadrže –COOH."],["Esterifikacija obično uključuje:",["Kiselinu i alkohol","Alken i vodonik","So i bazu","Amin i alkan"],0,"Karboksilna kiselina i alkohol daju estar i vodu."],["Koja je funkcionalna grupa amina?",["Amino grupa","Karboksilna grupa","Ester grupa","Aldehidna grupa"],0,"Amini su derivati amonijaka sa amino azotom."],["U reakciji kiseline i amina nastaje najčešće:",["Amonijumova so","Alken","Aldehid","Keton"],0,"Amin prihvata proton i nastaje amonijumova so."]],[["Peptidna veza nastaje između:",["Dve OH grupe","COOH i NH₂ grupa","Dva fosfata","Dve metil grupe"],1,"Kondenzacijom karboksilne i amino grupe nastaje amidna (peptidna) veza."],["Koji šećer je monosaharid?",["Saharoza","Skrob","Glukoza","Celuloza"],2,"Glukoza je monosaharid."],["Koja baza se nalazi u RNK, ali ne u DNK?",["Timin","Uracil","Guanin","Adenin"],1,"RNK sadrži uracil umesto timina."],["Šta je denaturacija proteina?",["Prekid svih peptidnih veza uvek","Promena prostorne strukture","Sinteza DNK","Povećanje broja aminokiselina"],1,"Denaturacija narušava viši nivo strukture proteina, obično bez prekida primarne strukture."]],[["Koji element je centralni atom hemoglobinske hem-grupe?",["Mg","Fe","Zn","Cu"],1,"Hem sadrži gvožđe koje reverzibilno vezuje kiseonik."],["Koja je glavna energetska valuta ćelije?",["ATP","DNK","Urea","Holesterol"],0,"ATP prenosi energiju između metaboličkih procesa."],["Koji vitamin je rastvorljiv u mastima?",["Vitamin C","Vitamin B₁","Vitamin D","Vitamin B₁₂"],2,"Vitamini A, D, E i K su liposolubilni."],["Koja jedinjenja katalizuju većinu biohemijskih reakcija?",["Enzimi","Trigliceridi","Soli natrijuma","Steroidni hormoni uvek"],0,"Enzimi su biološki katalizatori."]]];</script><script>const DATA={"topics":["Struktura atoma","Hemijske veze","Energetika","Kinetika i ravnoteža","Rastvori","Disocijacija","Kiseline i baze","pH i puferi","Soli","Oksidoredukcija","Elektrohemija","Oksidi i hidridi","Ugljovodonici","Organska jedinjenja","Biomolekuli"],"questions":[["Koji kvantni broj određuje oblik orbitale?",["Glavni n","Orbitalni l","Magnetni m","Spinski ms"],1,"Orbitalni kvantni broj l određuje oblik orbitale."],["Koja veza nastaje deljenjem elektronskog para?",["Jonska","Kovalentna","Metalna","Vodonična"],1,"Kovalentna veza nastaje deljenjem jednog ili više elektronskih parova."],["Egzotermna reakcija ima:",["ΔH > 0","ΔH < 0","ΔH = 0 uvek","Nema entalpiju"],1,"Egzotermne reakcije oslobađaju toplotu, pa je promena entalpije negativna."],["Katalizator:",["Povećava energiju aktivacije","Menja ravnotežnu konstantu","Smanjuje energiju aktivacije","Troši se u potpunosti"],2,"Katalizator ubrzava reakciju alternativnim putem sa manjom energijom aktivacije."],["Koliko molova ima 1 dm³ rastvora koncentracije 0,5 mol/dm³?",["0,25","0,5","1","2"],1,"n = c·V = 0,5·1 = 0,5 mol."],["Stepen disocijacije α predstavlja:",["Udeo disociranih čestica","Masu rastvora","Broj protona","Temperaturu"],0,"α je odnos broja disociranih i ukupnog početnog broja čestica."],["Koja supstanca je amfoterna?",["NaCl","Al(OH)₃","HCl","NaOH"],1,"Aluminijum-hidroksid reaguje i sa kiselinama i sa bazama."],["Koliki je pH rastvora ako je [H⁺] = 10⁻³ mol/dm³?",["3","7","11","-3"],0,"pH = −log[H⁺] = 3."],["Koja so nastaje neutralizacijom HCl i NaOH?",["Na₂SO₄","NaCl","KCl","NaNO₃"],1,"HCl + NaOH → NaCl + H₂O."],["Oksidacija je proces:",["Primanja elektrona","Otpuštanja elektrona","Primanja protona","Stvaranja taloga"],1,"Oksidacija znači gubitak elektrona i porast oksidacionog broja."],["Na kojoj elektrodi se odvija redukcija?",["Anodi","Katodi","Na obe uvek","Ni na jednoj"],1,"Redukcija se uvek odvija na katodi."],["Koji oksid je kiseli oksid?",["Na₂O","CaO","SO₃","MgO"],2,"SO₃ je kiseli oksid; sa vodom gradi sumpornu kiselinu."],["Opšta formula acikličnih alkana je:",["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙHₙ"],1,"Zasićeni aciklični alkani imaju opštu formulu CₙH₂ₙ₊₂."],["Koja funkcionalna grupa je karakteristična za aldehide?",["–COOH","–CHO","–OH","–NH₂"],1,"Aldehidi sadrže terminalnu karbonilnu grupu –CHO."],["Kojom vezom su povezane aminokiseline u proteinima?",["Estarskom","Peptidnom","Glikozidnom","Jonskom isključivo"],1,"Peptidna veza nastaje između karboksilne grupe jedne i amino-grupe druge aminokiseline."]]};let current=0,selected=-1,checked=false,qi=0,activeQuestions=[];DATA.questions=DATA.questions.map((q,i)=>[q,...window.EXTRA_QUESTIONS[i]]);const $=id=>document.getElementById(id);DATA.topics.forEach((t,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="num">OBLAST '+(i+1)+'</span><h3>'+t+'</h3><small>5 pitanja →</small>';b.onclick=()=>start(i);$('topics').append(b)});function start(i){current=i;qi=0;activeQuestions=[...DATA.questions[i]];for(let k=activeQuestions.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[activeQuestions[k],activeQuestions[j]]=[activeQuestions[j],activeQuestions[k]];}showQuestion();};function showQuestion(){selected=-1;checked=false;$('home').classList.add('hidden');$('test').classList.remove('hidden');$('progress').textContent='Oblast '+(current+1)+' od 15 • pitanje '+(qi+1)+' od '+activeQuestions.length;$('topic').textContent=DATA.topics[current];$('question').textContent=activeQuestions[qi][0];$('answers').innerHTML='';activeQuestions[qi][1].forEach((a,j)=>{const b=document.createElement('button');b.className='option';b.textContent=(j+1)+'. '+a;b.onclick=()=>{if(checked)return;selected=j;document.querySelectorAll('.option').forEach((el,k)=>el.classList.toggle('selected',k===j));$('check').disabled=false};$('answers').append(b)});$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('check').disabled=true;$('next').classList.add('hidden')};$('check').onclick=()=>{if(selected<0||checked)return;checked=true;const q=activeQuestions[qi];document.querySelectorAll('.option').forEach((el,k)=>{el.disabled=true;el.classList.toggle('correct',k===q[2]);el.classList.toggle('wrong',k===selected&&selected!==q[2])});$('feedback').classList.remove('hidden');$('feedback').textContent=(selected===q[2]?'✓ Tačno! ':'✗ Netačno. Tačan odgovor: '+q[1][q[2]]+'. ')+q[3];$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=qi===activeQuestions.length-1?'Završi oblast':'Sledeće pitanje →'};$('next').onclick=()=>{if(qi<activeQuestions.length-1){qi++;showQuestion()}else{$('test').classList.add('hidden');$('home').classList.remove('hidden')}};$('back').onclick=()=>{$('test').classList.add('hidden');$('home').classList.remove('hidden')};</script></body></html>
