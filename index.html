<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HemijaLab — Prijemni</title><style>:root{font-family:system-ui,Arial;background:#0d1724;color:#eaf4f3}*{box-sizing:border-box}body{margin:0}header{padding:24px max(24px,calc((100vw - 1100px)/2));background:#142538;border-bottom:1px solid #294153}h1{margin:0;color:#70e0b2}p{color:#a8bfca}.wrap{max-width:1100px;margin:32px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card,.quiz{background:#182a3b;border:1px solid #30485a;border-radius:16px;padding:20px}.card{cursor:pointer;text-align:left;color:#fff;font:inherit}.card:hover{border-color:#70e0b2}.num{color:#70e0b2;font-size:13px}.quiz{max-width:750px;margin:auto}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px;border:1px solid #42596b;border-radius:10px;background:#20364a;color:#fff;font:inherit;cursor:pointer}.option.selected{border-color:#70e0b2;background:#244d4a}.option.correct{border-color:#5de5a3;background:#174b3a}.option.wrong{border-color:#ff8787;background:#60363b}.btn{background:#70e0b2;color:#102a2a;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}.btn:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#30475a;color:white}.feedback{margin-top:18px;padding:16px;border-radius:10px;background:#243b4b}.hidden{display:none}small{color:#a8bfca}footer{margin:40px auto;text-align:center;color:#92a8b5}</style></head><body><header><h1>⚗ HemijaLab</h1><p>Uči • Vežbaj • Razumi — priprema prijemnog iz hemije</p></header><main class="wrap"><section id="home"><h2>Izaberi oblast</h2><p>15 oblasti • pitanja sa trenutnom proverom i objašnjenjem. Početna demonstraciona banka — proširivaćemo je zajedno.</p><div id="topics" class="grid"></div></section><section id="test" class="quiz hidden"><small id="progress"></small><h2 id="topic"></h2><h3 id="question"></h3><div id="answers"></div><button class="btn" id="check" disabled>Proveri odgovor</button><button class="btn hidden" id="next">Sledeće pitanje</button><button class="btn secondary" id="back">Sve oblasti</button><div id="feedback" class="feedback hidden" aria-live="polite"></div></section></main><footer>HemijaLab • Vežbanje hemije za prijemni</footer><script>const DATA={"topics":["Struktura atoma","Hemijske veze","Energetika","Kinetika i ravnoteža","Rastvori","Disocijacija","Kiseline i baze","pH i puferi","Soli","Oksidoredukcija","Elektrohemija","Oksidi i hidridi","Ugljovodonici","Organska jedinjenja","Biomolekuli"],"questions":[["Koji kvantni broj određuje oblik orbitale?",["Glavni n","Orbitalni l","Magnetni m","Spinski ms"],1,"Orbitalni kvantni broj l određuje oblik orbitale."],["Koja veza nastaje deljenjem elektronskog para?",["Jonska","Kovalentna","Metalna","Vodonična"],1,"Kovalentna veza nastaje deljenjem jednog ili više elektronskih parova."],["Egzotermna reakcija ima:",["ΔH > 0","ΔH < 0","ΔH = 0 uvek","Nema entalpiju"],1,"Egzotermne reakcije oslobađaju toplotu, pa je promena entalpije negativna."],["Katalizator:",["Povećava energiju aktivacije","Menja ravnotežnu konstantu","Smanjuje energiju aktivacije","Troši se u potpunosti"],2,"Katalizator ubrzava reakciju alternativnim putem sa manjom energijom aktivacije."],["Koliko molova ima 1 dm³ rastvora koncentracije 0,5 mol/dm³?",["0,25","0,5","1","2"],1,"n = c·V = 0,5·1 = 0,5 mol."],["Stepen disocijacije α predstavlja:",["Udeo disociranih čestica","Masu rastvora","Broj protona","Temperaturu"],0,"α je odnos broja disociranih i ukupnog početnog broja čestica."],["Koja supstanca je amfoterna?",["NaCl","Al(OH)₃","HCl","NaOH"],1,"Aluminijum-hidroksid reaguje i sa kiselinama i sa bazama."],["Koliki je pH rastvora ako je [H⁺] = 10⁻³ mol/dm³?",["3","7","11","-3"],0,"pH = −log[H⁺] = 3."],["Koja so nastaje neutralizacijom HCl i NaOH?",["Na₂SO₄","NaCl","KCl","NaNO₃"],1,"HCl + NaOH → NaCl + H₂O."],["Oksidacija je proces:",["Primanja elektrona","Otpuštanja elektrona","Primanja protona","Stvaranja taloga"],1,"Oksidacija znači gubitak elektrona i porast oksidacionog broja."],["Na kojoj elektrodi se odvija redukcija?",["Anodi","Katodi","Na obe uvek","Ni na jednoj"],1,"Redukcija se uvek odvija na katodi."],["Koji oksid je kiseli oksid?",["Na₂O","CaO","SO₃","MgO"],2,"SO₃ je kiseli oksid; sa vodom gradi sumpornu kiselinu."],["Opšta formula acikličnih alkana je:",["CₙH₂ₙ","CₙH₂ₙ₊₂","CₙH₂ₙ₋₂","CₙHₙ"],1,"Zasićeni aciklični alkani imaju opštu formulu CₙH₂ₙ₊₂."],["Koja funkcionalna grupa je karakteristična za aldehide?",["–COOH","–CHO","–OH","–NH₂"],1,"Aldehidi sadrže terminalnu karbonilnu grupu –CHO."],["Kojom vezom su povezane aminokiseline u proteinima?",["Estarskom","Peptidnom","Glikozidnom","Jonskom isključivo"],1,"Peptidna veza nastaje između karboksilne grupe jedne i amino-grupe druge aminokiseline."]]};let current=0,selected=-1,checked=false;const $=id=>document.getElementById(id);DATA.topics.forEach((t,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="num">OBLAST '+(i+1)+'</span><h3>'+t+'</h3><small>Pokreni vežbu →</small>';b.onclick=()=>start(i);$('topics').append(b)});function start(i){current=i;selected=-1;checked=false;$('home').classList.add('hidden');$('test').classList.remove('hidden');$('progress').textContent='Oblast '+(i+1)+' od 15';$('topic').textContent=DATA.topics[i];$('question').textContent=DATA.questions[i][0];$('answers').innerHTML='';DATA.questions[i][1].forEach((a,j)=>{const b=document.createElement('button');b.className='option';b.textContent=(j+1)+'. '+a;b.onclick=()=>{if(checked)return;selected=j;document.querySelectorAll('.option').forEach((el,k)=>el.classList.toggle('selected',k===j));$('check').disabled=false};$('answers').append(b)});$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('check').disabled=true;$('next').classList.add('hidden')};$('check').onclick=()=>{if(selected<0||checked)return;checked=true;const q=DATA.questions[current];document.querySelectorAll('.option').forEach((el,k)=>{el.disabled=true;el.classList.toggle('correct',k===q[2]);el.classList.toggle('wrong',k===selected&&selected!==q[2])});$('feedback').classList.remove('hidden');$('feedback').textContent=(selected===q[2]?'✓ Tačno! ':'✗ Netačno. Tačan odgovor: '+q[1][q[2]]+'. ')+q[3];$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=current===14?'Ponovi od početka':'Sledeća oblast →'};$('next').onclick=()=>start((current+1)%15);$('back').onclick=()=>{$('test').classList.add('hidden');$('home').classList.remove('hidden')};</script></body></html>
