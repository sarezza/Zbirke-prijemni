;$('progress').textContent='Oblast '+(current+1)+' od 15 • pitanje '+(qi+1)+' od '+activeQuestions.length;$('topic').textContent=DATA.topics[current];$('question').textContent=activeQuestions[qi][0];$('answers').innerHTML='';activeQuestions[qi][1].forEach((a,j)=>{const b=document.createElement('button');b.className='option';b.textContent=(j+1)+'. '+a;b.onclick=()=>{if(checked)return;selected=j;document.querySelectorAll('.option').forEach((el,k)=>el.classList.toggle('selected',k===j));$('check').disabled=false};$('answers').append(b)});$('feedback').classList.add('hidden');$('check').classList.remove('hidden');$('check').disabled=true;$('next').classList.add('hidden')};$('check').onclick=()=>{if(selected<0||checked)return;checked=true;const q=activeQuestions[qi];document.querySelectorAll('.option').forEach((el,k)=>{el.disabled=true;el.classList.toggle('correct',k===q[2]);el.classList.toggle('wrong',k===selected&&selected!==q[2])});$('feedback').classList.remove('hidden');$('feedback').textContent=(selected===q[2]?'✓ Tačno! ':'✗ Netačno. Tačan odgovor: '+q[1][q[2]]+'. ')+q[3];$('check').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent=qi===activeQuestions.length-1?'Završi oblast':'Sledeće pitanje →'};$('next').onclick=()=>{if(qi<activeQuestions.length-1){qi++;showQuestion()}else{$('test').classList.add('hidden');$('home').classList.remove('hidden')}};$('back').onclick=()=>{$('test').classList.add('hidden');$('home').classList.remove('hidden')};</script></body></html>
